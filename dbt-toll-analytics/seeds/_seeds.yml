version: 2

seeds:
  - name: raw_toll_plazas
    description: "BRONZE — praças de pedágio (dados sintéticos). A tarifa NÃO mora aqui: ela tem história e vive em raw_fare_schedule."
    columns:
      - name: plaza_id
        description: "PK da praça."
        tests: [unique, not_null]

  - name: raw_fare_schedule
    description: >
      BRONZE — tabela de tarifas COM VIGÊNCIA (SCD2-style). Cada linha vale de
      valid_from até valid_to. É a fonte da verdade para o join point-in-time:
      a P003 muda de 990 para 1050 em 2026-05-03 (ver §7 do PLANO).
    columns:
      - name: plaza_id
        description: "FK para raw_toll_plazas."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('raw_toll_plazas')
                field: plaza_id
      - name: fare_cents
        description: "Tarifa base (centavos) vigente no intervalo."
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]

  - name: raw_vehicles
    description: "BRONZE — veículos cadastrados (placa será mascarada na silver)."
    columns:
      - name: vehicle_id
        tests: [unique, not_null]

  - name: raw_vehicle_categories
    description: "BRONZE — categorias de veículo e multiplicador de tarifa."
    columns:
      - name: category
        tests: [unique, not_null]

  - name: raw_toll_transactions
    description: >
      BRONZE — transações de pedágio cruas. Contém imperfeições propositais
      (duplicidade exata, valor nulo/zero, tarifa divergente, cobrança em falha)
      para exercitar limpeza e auditoria nas camadas seguintes.
