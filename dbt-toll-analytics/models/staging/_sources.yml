version: 2

# SOURCES — contrato de ingestão da camada bronze.
#
# ADR-13 (realizado na Fase 4): o bronze NÃO vem mais de seeds. Um pipeline de
# INGESTÃO (dlt, projeto ingestion-toll-analytics) carrega os arquivos de landing
# no schema `landing` do DuckDB; o staging consome via source() (não mais ref()).
# Continua reprodutível offline porque o dlt lê CSVs commitados, não uma API.
#
# Fluxo:  python toll_ingestion.py   (dlt: arquivos -> landing)
#         dbt build                  (transforma a partir do source)
# Frescor: dbt source freshness --profiles-dir .

sources:
  - name: toll_raw
    description: "Camada de ingestão (bronze), carregada pelo dlt no schema landing."
    schema: landing
    tables:
      - name: raw_toll_transactions
        description: "Transações de pedágio cruas (landing, via dlt merge)."
        # event_ts vem como texto do CSV; cast para o cálculo de frescor.
        loaded_at_field: "cast(event_ts as timestamp)"
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 365, period: day}

      - name: raw_toll_plazas
        description: "Cadastro de praças de pedágio (landing)."
        columns:
          - name: plaza_id
            tests: [unique, not_null]

      - name: raw_fare_schedule
        description: "Tabela de tarifas com vigência (landing)."
        columns:
          - name: plaza_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('toll_raw', 'raw_toll_plazas')
                    field: plaza_id
          - name: fare_cents
            tests: [not_null]

      - name: raw_vehicles
        description: "Cadastro de veículos (landing)."
        columns:
          - name: vehicle_id
            tests: [unique, not_null]

      - name: raw_vehicle_categories
        description: "Categorias de veículo e multiplicador (landing)."
        columns:
          - name: category
            tests: [unique, not_null]
