<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="toll-analytics-platform — plataforma de dados end-to-end">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.88" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glowV)"/>
  <rect width="1280" height="640" fill="url(#glowC)"/>
  <rect x="12" y="12" width="1256" height="616" rx="22" fill="none" stroke="#2a3550" stroke-width="1.5"/>

  <!-- Medallion motif (top-right) -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <g><rect x="1028" y="168" width="150" height="30" rx="9" fill="#0d1117" stroke="#b0703a" stroke-width="2"/><text x="1103" y="188" fill="#d69a63">Bronze</text></g>
    <g><rect x="1046" y="128" width="132" height="30" rx="9" fill="#0d1117" stroke="#9aa4b2" stroke-width="2"/><text x="1112" y="148" fill="#c3ccd8">Silver</text></g>
    <g><rect x="1064" y="88"  width="114" height="30" rx="9" fill="#0d1117" stroke="#d4af37" stroke-width="2"/><text x="1121" y="108" fill="#e8cc6a">Gold</text></g>
  </g>
  <g opacity="0.5" fill="#0d1117" stroke="#22d3ee" stroke-width="2">
    <circle cx="140" cy="110" r="6"/>
  </g>

  <!-- wordmark -->
  <text x="640" y="188" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.5" fill="url(#ink)">toll-analytics-platform</text>

  <!-- taglines -->
  <text x="640" y="238" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#e6ecf7">Plataforma de dados end-to-end &#183; Open Source</text>
  <text x="640" y="278" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#8b97ad">dev em DuckDB (reprodut&#237;vel) &#183; prod em Databricks (Unity Catalog + Delta)</text>

  <!-- pipeline pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <g><rect x="367" y="345" width="60"  height="36" rx="18" fill="#161f33" stroke="#33406090"/><text x="397" y="369" fill="#cdd6e6">dlt</text></g>
    <g><rect x="439" y="345" width="60"  height="36" rx="18" fill="#161f33" stroke="#33406090"/><text x="469" y="369" fill="#cdd6e6">dbt</text></g>
    <g><rect x="511" y="345" width="86"  height="36" rx="18" fill="#161f33" stroke="#33406090"/><text x="554" y="369" fill="#cdd6e6">Airflow</text></g>
    <g><rect x="609" y="345" width="70"  height="36" rx="18" fill="#161f33" stroke="#33406090"/><text x="644" y="369" fill="#cdd6e6">Soda</text></g>
    <g><rect x="691" y="345" width="118" height="36" rx="18" fill="#161f33" stroke="#33406090"/><text x="750" y="369" fill="#cdd6e6">OpenLineage</text></g>
    <g><rect x="821" y="345" width="92"  height="36" rx="18" fill="#161f33" stroke="#33406090"/><text x="867" y="369" fill="#cdd6e6">Evidence</text></g>
  </g>

  <!-- highlights -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <g><rect x="374" y="420" width="104" height="38" rx="9" fill="#0e1b1f" stroke="#22d3ee66"/><text x="426" y="445" fill="#67e8f9">Medallion</text></g>
    <g><rect x="492" y="420" width="104" height="38" rx="9" fill="#0e1b1f" stroke="#22d3ee66"/><text x="544" y="445" fill="#67e8f9">Delta Lake</text></g>
    <g><rect x="610" y="420" width="132" height="38" rx="9" fill="#151226" stroke="#a78bfa66"/><text x="676" y="445" fill="#c4b5fd">Unity Catalog</text></g>
    <g><rect x="756" y="420" width="150" height="38" rx="9" fill="#151226" stroke="#a78bfa66"/><text x="831" y="445" fill="#c4b5fd">CI/CD &#183; Terraform</text></g>
  </g>

  <!-- divider -->
  <line x1="470" y1="500" x2="810" y2="500" stroke="url(#ink)" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

  <!-- footer -->
  <text x="640" y="540" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#dbe3f0">github.com/alanjoffre/toll-analytics-platform</text>
  <text x="640" y="570" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#8b97ad">&#9654; dashboard ao vivo &#183; alanjoffre.github.io/toll-analytics-platform</text>

  <!-- road motif -->
  <line x1="140" y1="602" x2="1140" y2="602" stroke="#22d3ee" stroke-width="2" opacity="0.20" stroke-dasharray="26 18" stroke-linecap="round"/>
</svg>
