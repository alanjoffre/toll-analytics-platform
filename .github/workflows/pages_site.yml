name: site (BI + lineage) → Pages

# Publica UM site no GitHub Pages combinando:
#   - /            -> dashboard BI (Evidence.dev), lendo os marts do dbt
#   - /lineage/    -> dbt docs (lineage navegável)
# Substitui o antigo dbt_docs.yml (um único dono do Pages).
# Pré-requisito 1x: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: dbt — ingestão + build + docs (static)
        working-directory: dbt-toll-analytics
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r ../ingestion-toll-analytics/requirements.txt
          .venv/bin/python ../ingestion-toll-analytics/toll_ingestion.py
          .venv/bin/dbt deps --profiles-dir .
          .venv/bin/dbt build --exclude tag:observability --profiles-dir .
          .venv/bin/dbt docs generate --static --profiles-dir .

      - name: Evidence — build do dashboard (lê o DuckDB do dbt)
        working-directory: bi-toll-analytics
        run: |
          npm install --no-audit --no-fund
          npm run sources
          npm run build

      - name: Montar site combinado (BI em / + lineage em /lineage/)
        run: |
          mkdir -p _site
          cp -r bi-toll-analytics/build/* _site/
          mkdir -p _site/lineage
          cp dbt-toll-analytics/target/static_index.html _site/lineage/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
