name: dbt docs → GitHub Pages

# Publica o `dbt docs` (lineage navegável) como site estático no GitHub Pages.
# Gera um ÚNICO arquivo self-contained (`--static`) com manifest + catalog embutidos.
#
# PRÉ-REQUISITO (1x, manual): no GitHub, Settings → Pages → "Build and deployment"
# → Source: **GitHub Actions**. Sem isso, o deploy falha com "Pages not enabled".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys concorrentes; não cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: dbt-toll-analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt-toll-analytics/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: dbt deps
        run: dbt deps --profiles-dir .

      # Popula o DuckDB para o catalog (colunas/tipos) ficar completo na doc.
      - name: dbt build (dev, exclui observability)
        run: dbt build --exclude tag:observability --profiles-dir .

      # --static: gera target/static_index.html (tudo embutido em 1 arquivo).
      - name: dbt docs generate (static)
        run: dbt docs generate --static --profiles-dir .

      - name: Montar site/
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          cp target/static_index.html "$GITHUB_WORKSPACE/site/index.html"

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # auto-habilita o Pages (fonte = GitHub Actions)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site   # relativo à raiz do repositório (GITHUB_WORKSPACE)

      - id: deployment
        uses: actions/deploy-pages@v4
